<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 360px;
      margin: 30px auto;
      padding: 16px;
      background: #f2f4f8;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0002;
    }

    #pantalla {
      box-sizing: border-box;
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: right;
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    .teclado {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button, input {
      font-size: 18px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #bbb;
    }

    button { cursor: pointer; }
    .operador { background: #e6edff; }
    .igual { background: #b9d1ff; }
    .ancho { grid-column: span 2; }

    #juego { display: none; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Calculadora</h1>

    <input id="pantalla" value="0" readonly>

    <div class="teclado">
      <button onclick="limpiar()">C</button>
      <button onclick="borrar()">⌫</button>
      <button class="operador" onclick="elegirOperador('/')">÷</button>
      <button class="operador" onclick="elegirOperador('*')">×</button>

      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button class="operador" onclick="elegirOperador('-')">−</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button class="operador" onclick="elegirOperador('+')">+</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button class="igual" onclick="calcular()" style="grid-row: span 2">=</button>

      <button class="ancho" onclick="agregar('0')">0</button>
      <button onclick="agregar('.')">.</button>
    </div>

    <hr>

    <h2>Modo juego</h2>
    <input id="codigo" type="password" placeholder="Introduce el código">
    <button onclick="comprobarCodigo()">Entrar</button>
    <p id="mensaje"></p>

    <section id="juego">
      <h2>Adivina el número</h2>
      <p>Estoy pensando en un número del 1 al 10.</p>
      <input id="intento" type="number" min="1" max="10" placeholder="Tu número">
      <button onclick="probarNumero()">Probar</button>
      <p id="pista"></p>
      <button onclick="nuevoNumero()">Nuevo número</button>
    </section>
  </main>

  <script>
    const pantalla = document.getElementById("pantalla");
    let numeroAnterior = null;
    let operador = null;
    let empezarNumeroNuevo = true;

    function agregar(valor) {
      if (empezarNumeroNuevo) {
        pantalla.value = valor === "." ? "0." : valor;
        empezarNumeroNuevo = false;
        return;
      }

      if (valor === "." && pantalla.value.includes(".")) return;
      pantalla.value = pantalla.value === "0" && valor !== "."
        ? valor
        : pantalla.value + valor;
    }

    function elegirOperador(nuevoOperador) {
      numeroAnterior = Number(pantalla.value);
      operador = nuevoOperador;
      empezarNumeroNuevo = true;
    }

    function calcular() {
      if (operador === null || numeroAnterior === null) return;

      const numeroActual = Number(pantalla.value);
      let resultado;

      if (operador === "+") resultado = numeroAnterior + numeroActual;
      if (operador === "-") resultado = numeroAnterior - numeroActual;
      if (operador === "*") resultado = numeroAnterior * numeroActual;
      if (operador === "/") {
        if (numeroActual === 0) {
          pantalla.value = "Error";
          operador = null;
          empezarNumeroNuevo = true;
          return;
        }
        resultado = numeroAnterior / numeroActual;
      }

      pantalla.value = String(Number(resultado.toFixed(8)));
      operador = null;
      numeroAnterior = null;
      empezarNumeroNuevo = true;
    }

    function limpiar() {
      pantalla.value = "0";
      numeroAnterior = null;
      operador = null;
      empezarNumeroNuevo = true;
    }

    function borrar() {
      if (pantalla.value.length <= 1) {
        pantalla.value = "0";
      } else {
        pantalla.value = pantalla.value.slice(0, -1);
      }
    }

    function comprobarCodigo() {
      const codigo = document.getElementById("codigo").value;

      if (codigo === "JUEGO123") {
        document.getElementById("juego").style.display = "block";
        document.getElementById("mensaje").textContent = "Modo juego abierto.";
      } else {
        document.getElementById("mensaje").textContent = "Ese código no es correcto.";
      }
    }

    let numeroSecreto = Math.floor(Math.random() * 10) + 1;

    function probarNumero() {
      const intento = Number(document.getElementById("intento").value);
      const pista = document.getElementById("pista");

      if (intento === numeroSecreto) {
        pista.textContent = "¡Lo has acertado!";
      } else if (intento < numeroSecreto) {
        pista.textContent = "Prueba con un número más alto.";
      } else {
        pista.textContent = "Prueba con un número más bajo.";
      }
    }

    function nuevoNumero() {
      numeroSecreto = Math.floor(Math.random() * 10) + 1;
      document.getElementById("pista").textContent = "Nuevo número. ¡Prueba otra vez!";
      document.getElementById("intento").value = "";
    }
  </script>
</body>
</html>
