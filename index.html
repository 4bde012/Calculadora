<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Code</title>

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #f5f4ff;
      background: radial-gradient(circle at top left, #4938a8, transparent 38%),
                  linear-gradient(135deg, #121426, #202340);
    }

    .app {
      width: min(100%, 370px);
      padding: 24px;
      border: 1px solid #ffffff24;
      border-radius: 24px;
      background: #191b30;
      box-shadow: 0 20px 60px #0006;
    }

    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0 0 6px; }
    header p, .ayuda { color: #a9abc7; }

    #pantalla {
      width: 100%;
      height: 72px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid #ffffff20;
      border-radius: 14px;
      background: #101222;
      color: white;
      text-align: right;
      font-size: 32px;
    }

    .teclado {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    button, input { font: inherit; }

    .teclado button {
      min-height: 56px;
      border: 0;
      border-radius: 13px;
      background: #292c47;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .teclado button:hover, .code-button:hover { filter: brightness(1.2); }
    .operador { background: #39356d !important; }
    .igual { background: #7658f2 !important; }
    .cero { grid-column: span 2; }

    hr { margin: 22px 0; border: 0; border-top: 1px solid #ffffff20; }

    .code-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(100deg, #7658f2, #a14de0);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #zonaCode {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: #111326;
    }

    #zonaCode h2 { margin: 0 0 8px; }
    .ayuda { font-size: 14px; }

    .fila {
      display: flex;
      gap: 8px;
    }

    #codigo {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #ffffff25;
      border-radius: 10px;
      background: #20233c;
      color: white;
    }

    .entrar {
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: #7658f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #mensaje { min-height: 20px; color: #c9caff; font-size: 14px; }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>Calculadora</h1>
      <p>Calcula y descubre el Modo Code</p>
    </header>

    <input id="pantalla" value="0" aria-label="Pantalla" readonly>

    <div class="teclado">
      <button onclick="limpiar()">C</button>
      <button onclick="borrar()">⌫</button>
      <button class="operador" onclick="elegir('/')">÷</button>
      <button class="operador" onclick="elegir('*')">×</button>

      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button class="operador" onclick="elegir('-')">−</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button class="operador" onclick="elegir('+')">+</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button class="igual" onclick="calcular()" style="grid-row: span 2">=</button>

      <button class="cero" onclick="agregar('0')">0</button>
      <button onclick="agregar('.')">.</button>
    </div>

    <hr>

    <button class="code-button" onclick="mostrarCode()">&lt;/&gt; Modo Code</button>

    <section id="zonaCode">
      <h2>Modo Code</h2>
      <p class="ayuda">Introduce el código para entrar a la zona de juegos.</p>
      <div class="fila">
        <input id="codigo" type="password" placeholder="Código secreto">
        <button class="entrar" onclick="entrar()">Entrar</button>
      </div>
      <p id="mensaje" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const pantalla = document.getElementById("pantalla");
    let anterior = null;
    let operador = null;
    let nuevoNumero = true;

    function agregar(valor) {
      if (nuevoNumero) {
        pantalla.value = valor === "." ? "0." : valor;
        nuevoNumero = false;
      } else if (valor !== "." || !pantalla.value.includes(".")) {
        pantalla.value = pantalla.value === "0" && valor !== "."
          ? valor
          : pantalla.value + valor;
      }
    }

    function elegir(op) {
      anterior = Number(pantalla.value);
      operador = op;
      nuevoNumero = true;
    }

    function calcular() {
      if (operador === null) return;

      const actual = Number(pantalla.value);
      let resultado;

      if (operador === "+") resultado = anterior + actual;
      if (operador === "-") resultado = anterior - actual;
      if (operador === "*") resultado = anterior * actual;

      if (operador === "/") {
        if (actual === 0) {
          pantalla.value = "Error";
          operador = null;
          nuevoNumero = true;
          return;
        }
        resultado = anterior / actual;
      }

      pantalla.value = String(Number(resultado.toFixed(8)));
      anterior = null;
      operador = null;
      nuevoNumero = true;
    }

    function limpiar() {
      pantalla.value = "0";
      anterior = null;
      operador = null;
      nuevoNumero = true;
    }

    function borrar() {
      if (nuevoNumero) return;
      pantalla.value = pantalla.value.length > 1
        ? pantalla.value.slice(0, -1)
        : "0";
    }

    function mostrarCode() {
      const zona = document.getElementById("zonaCode");
      zona.style.display = zona.style.display === "block" ? "none" : "block";
    }

    function entrar() {
      const codigo = document.getElementById("codigo").value;
      const mensaje = document.getElementById("mensaje");

      if (codigo === "JUEGO123") {
        window.location.href = "juegos.html";
      } else {
        mensaje.textContent = "Código incorrecto. Prueba otra vez.";
      }
    }

    document.getElementById("codigo").addEventListener("keydown", event => {
      if (event.key === "Enter") entrar();
    });
  </script>
</body>
</html>
